name: CI
on:
  pull_request:
  push:
    branches: [main, master, revival]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Fail on known vulnerabilities in shipped dependencies
        run: yarn audit --groups dependencies --level moderate
      - run: yarn lint
      - name: Build
        run: yarn build
        env:
          ELASTIC_SERVER: 127.0.0.1
